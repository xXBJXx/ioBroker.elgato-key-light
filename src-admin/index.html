<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Elgato Key Light</title><script>
    const script = document.createElement('script');
    window.registerSocketOnLoad = cb => { window.socketLoadedHandler = cb; };
    const query = Object.fromEntries(new URLSearchParams(window.location.search));
    script.onload = () => window.socketLoadedHandler?.();
    script.src = window.location.port === '3000'
      ? `${window.location.protocol}//${query.host || window.location.hostname}:${query.port || 8081}/lib/js/socket.io.js`
      : './../../lib/js/socket.io.js';
    document.head.appendChild(script);
  </script></head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
